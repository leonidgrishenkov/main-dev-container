# Trivy suppressions for the PR image gate (.github/workflows/pr.yml).
#
# Policy: the gate stays strict for the base OS, curl/git/gnupg, OpenSSL, the Go
# stdlib and anything else in a TLS/crypto path or that parses untrusted network
# input. Those get FIXED (bump the package, toolchain or tool), never listed here.
# Only dev tooling driven interactively by the single trusted user of this
# container may be suppressed, and only when it is not exploitable here AND no
# upstream release fixes it (or the fix belongs to another repo).
#
# Rules for every entry:
#   - `paths` is mandatory. An unscoped id would also hide the same CVE in an OS
#     package or in another tool, which is exactly what the gate must catch.
#   - `statement` says why it is not exploitable HERE, not just "dev tool".
#   - `expired_at` is ~6 months out. On expiry Trivy reports the finding again and
#     the gate fails, forcing a deliberate re-check. Do not just bump the date:
#     first look for an upstream release that makes the entry unnecessary.
#
# Field names are Trivy's: `expired_at` (underscore). An unknown key such as
# `expired-at` is silently ignored and the entry would never expire.

vulnerabilities:
  # --- npm bundled with Node (mise install) -----------------------------------
  # Node's bundled npm deps are NOT refreshed by every Node minor bump (26.3.1,
  # 26.4.0 and 26.5.0 all shipped the same undici/tar/brace-expansion); only a
  # Node release that carries a newer npm moves them. They used to be patched in
  # place in the Dockerfile with equality-pinned version guards, which broke the
  # build on any Node bump that shipped a newer copy. Now: bump `node` in
  # mise.toml when a release fixes them, and suppress what is left here.
  # Exception: a finding the policy says must be fixed and no Node release fixes
  # yet is patched in the Dockerfile behind a guard that turns into a no-op once
  # Node catches up (currently undici, for a TLS check bypass).
  # npm runs only when the user invokes npm/npx by hand, or at build time on
  # first-party repos (npx github:leonidgrishenkov/agent-skills).
  - id: CVE-2026-102276
    paths: &npm-brace [usr/local/share/mise/installs/node/*/lib/node_modules/npm/node_modules/brace-expansion/package.json]
    statement: &npm-brace-why >-
      brace-expansion DoS on crafted patterns, reached via minimatch on ignore
      and files globs. Impact is a crash of the user's own npm run; no service
      or other user shares the process.
    expired_at: 2027-04-10
  - id: CVE-2026-102278
    paths: *npm-brace
    statement: *npm-brace-why
    expired_at: 2027-04-10
