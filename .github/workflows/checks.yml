---
name: checks

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: run-hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ./Dockerfile

  trivy-scan:
    name: trivy-scan
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # Verified install from the GitHub release; see the action for why.
      - name: install-trivy
        uses: ./.github/actions/install-trivy

      - name: run-trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"
          scan-ref: .

  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: run-actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history; known findings are in .gitleaksignore
          persist-credentials: false

      # The version is pinned in mise.ci.toml, not mise.toml, which ships in the image.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          mise_env: ci
          install_args: gitleaks

      - name: scan-for-secrets
        run: gitleaks git . --redact --no-banner --verbose
