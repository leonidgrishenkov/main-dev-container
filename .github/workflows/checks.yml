---
name: checks

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: run-hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ./Dockerfile

  trivy-scan:
    name: trivy-scan
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      # Verified install from the GitHub release; see the action for why.
      - name: install-trivy
        uses: ./.github/actions/install-trivy

      - name: run-trivy-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: "1"
          scan-ref: .

  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: run-actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Loads mise.ci.toml, where the gitleaks version is pinned. It is kept out of mise.toml,
    # which ships in the image. Set for the whole job so the gitleaks shim resolves it too.
    env:
      MISE_ENV: ci
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history; known findings are in .gitleaksignore
          persist-credentials: false

      - uses: jdx/mise-action@3277a0f272901982804abc53abd93520db809be4 # v5.4.0
        with:
          install_args: gitleaks

      - name: scan-for-secrets
        run: gitleaks git . --redact --no-banner --verbose
