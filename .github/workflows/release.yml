---
name: release

on:
  push:
    tags:
      - '*.*'

env:
  REGISTRY: public.ecr.aws
  REGISTRY_ALIAS: a8c0b5z6
  IMAGE_NAME: devcr
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a multi-arch push mid-flight

permissions:
  contents: read

jobs:
  # Gate: a version tag is only a valid release if it points at a commit that is
  # part of main's history. Git tags aren't tied to a branch — anyone can tag a
  # commit on any branch — so we assert the tagged commit is an ancestor of
  # origin/main and fail the release otherwise. This blocks the build/push for
  # off-main tags (the tag ref itself still exists in Git; nothing is released).
  tag-ref-gate:
    name: tag-ref-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout-full-history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need full history + main to compute ancestry

      - name: assert-tagged-commit-is-reachable-from-main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_SHA="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::notice::Tag ${GITHUB_REF_NAME} (${TAG_SHA}) is on main — proceeding with release."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} (${TAG_SHA}) is NOT reachable from main. Version tags must be created from a commit on main. Aborting release."
            exit 1
          fi

  push:
    name: build-and-push
    needs: tag-ref-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write          # OIDC for the AWS role and cosign keyless signing
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: prepare-image-reference
        run: |
          FULL="${REGISTRY}/${REGISTRY_ALIAS}/${IMAGE_NAME}"
          {
            echo "FULL_IMAGE=${FULL}"
            echo "CACHE_IMAGE=${FULL}:buildcache"
            # Same weekly apt refresh as pr.yml: a release in the week of its PR reuses
            # the scanned apt layer; a later one rebuilds it with current fixes.
            echo "APT_REFRESH=$(date -u +%G-W%V)"
          } >> "$GITHUB_ENV"

      - name: set-up-qemu-multi-arch
        uses: docker/setup-qemu-action@v4

      - name: set-up-buildx
        uses: docker/setup-buildx-action@v4

      - name: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1   # ECR Public issues auth tokens only in us-east-1

      - name: log-in-to-aws-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # Resolve the dotfiles ref the Dockerfile defaults to (normally the tip of main)
      # to one commit, then build with exactly that commit and label the image with
      # it. The label is the commit the build checked out, not a separate guess.
      - name: resolve-dotfiles-revision
        id: dotfiles
        run: |
          URL="$(sed -n 's/^ARG DOTFILES_REPO_URL=//p' Dockerfile)"
          REF="$(sed -n 's/^ARG DOTFILES_REF=//p' Dockerfile)"
          if [[ "${REF}" =~ ^[0-9a-f]{40}$ ]]; then
            SHA="${REF}"
          else
            # Prefer a branch, then the commit an annotated tag points to, then a lightweight tag.
            SHA="$(git ls-remote "${URL}" "refs/heads/${REF}" "refs/tags/${REF}" "refs/tags/${REF}^{}" \
              | awk -v r="${REF}" '$2 == "refs/heads/" r { h = $1 } $2 == "refs/tags/" r { t = $1 }
                                   $2 == "refs/tags/" r "^{}" { p = $1 } END { print h ? h : (p ? p : t) }')"
          fi
          if [[ ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve dotfiles ref '${REF}' at ${URL}."
            exit 1
          fi
          echo "::notice::Dotfiles ${URL} ${REF} -> ${SHA}"
          { echo "url=${URL}"; echo "sha=${SHA}"; } >> "$GITHUB_OUTPUT"

      - name: derive-tags-and-labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE }}
          # Published tags: the full commit SHA (hardcoded in the build-push
          # step below) plus the git tag verbatim (e.g. 1.5). Do NOT use
          # type=semver here: it demands strict X.Y.Z, so a `1.5` tag is
          # rejected ("not a valid semver") and no image tag is generated.
          # type=ref,event=tag is safe because callers gate which tags trigger
          # a release (e.g. push tags: ['*.*']).
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.leonidgrishenkov.devcr.dotfiles.source=${{ steps.dotfiles.outputs.url }}
            io.github.leonidgrishenkov.devcr.dotfiles.revision=${{ steps.dotfiles.outputs.sha }}

      # Build multi-arch from registry cache (written by PR scan), then push with
      # SBOM + SLSA provenance attestations attached.
      - name: build-and-push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.FULL_IMAGE }}:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_REFRESH=${{ env.APT_REFRESH }}
            DOTFILES_REF=${{ steps.dotfiles.outputs.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }},mode=max,image-manifest=true,oci-mediatypes=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: install-cosign
        uses: sigstore/cosign-installer@v3

      - name: sign-image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes "${{ env.FULL_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: write-release-summary
        run: |
          {
            echo "### Docker release summary"
            echo ""
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ env.FULL_IMAGE }}\` |"
            echo "| Platforms | \`${{ env.PLATFORMS }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Dotfiles | \`${{ steps.dotfiles.outputs.sha }}\` |"
            echo "| Attestations | provenance=\`mode=max\` sbom=\`true\` |"
            echo "| Signed | ✅ cosign keyless (OIDC) |"
            echo "| Scan | Security › Code scanning alerts (Trivy SARIF from PR) |"
          } >> "$GITHUB_STEP_SUMMARY"
