---
name: release-docker-image

on:
  push:
    tags:
      - '*.*'

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  IMAGE_NAME: devcr
  REGISTRY_REPO: github/personal
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a multi-arch push mid-flight

permissions:
  contents: read

jobs:
  # Gate: a version tag is only a valid release if it points at a commit that is
  # part of main's history. Git tags aren't tied to a branch — anyone can tag a
  # commit on any branch — so we assert the tagged commit is an ancestor of
  # origin/main and fail the release otherwise. This blocks the build/push for
  # off-main tags (the tag ref itself still exists in Git; nothing is released).
  tag-ref-gate:
    name: tag-ref-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout-full-history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need full history + main to compute ancestry

      - name: assert-tagged-commit-is-reachable-from-main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_SHA="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::notice::Tag ${GITHUB_REF_NAME} (${TAG_SHA}) is on main — proceeding with release."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} (${TAG_SHA}) is NOT reachable from main. Version tags must be created from a commit on main. Aborting release."
            exit 1
          fi

  push:
    name: build-and-push
    needs: tag-ref-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC for cosign keyless signing
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: prepare-image-reference
        run: |
          FULL="${REGISTRY}/${REGISTRY_ID}/${REGISTRY_REPO}/${IMAGE_NAME}"
          echo "FULL_IMAGE=${FULL}" >> "$GITHUB_ENV"
          CACHE_REPO="${REGISTRY}/${REGISTRY_ID}/${REGISTRY_REPO}/cache"
          echo "CACHE_IMAGE=${CACHE_REPO}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: set-up-qemu-multi-arch
        uses: docker/setup-qemu-action@v4

      - name: set-up-buildx
        uses: docker/setup-buildx-action@v4

      - name: log-in-to-yandex-container-registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_CR_SA_AUTH_JSON }}

      - name: derive-tags-and-labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FULL_IMAGE }}
          # Published tags: the full commit SHA (hardcoded in the build-push
          # step below) plus the git tag verbatim (e.g. 1.5). Do NOT use
          # type=semver here: it demands strict X.Y.Z, so a `1.5` tag is
          # rejected ("not a valid semver") and no image tag is generated.
          # type=ref,event=tag is safe because callers gate which tags trigger
          # a release (e.g. push tags: ['*.*']).
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Build multi-arch from registry cache (written by PR scan), then push with
      # SBOM + SLSA provenance attestations attached.
      - name: build-and-push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.FULL_IMAGE }}:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:latest
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:latest,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: install-cosign
        uses: sigstore/cosign-installer@v3

      - name: sign-image
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: cosign sign --yes "${{ env.FULL_IMAGE }}@${{ steps.push.outputs.digest }}"

      - name: write-release-summary
        run: |
          {
            echo "### Docker release summary"
            echo ""
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| Image | \`${{ env.FULL_IMAGE }}\` |"
            echo "| Platforms | \`${{ env.PLATFORMS }}\` |"
            echo "| Digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| Attestations | provenance=\`mode=max\` sbom=\`true\` |"
            echo "| Signed | ✅ cosign keyless (OIDC) |"
            echo "| Scan | Security › Code scanning alerts (Trivy SARIF from PR) |"
          } >> "$GITHUB_STEP_SUMMARY"
