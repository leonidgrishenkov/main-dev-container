[tools]
node = "26.3.1"
neovim = "0.12.3"
# Go-based CLIs (fzf/lazygit/task/direnv/glow/shfmt) are NOT pinned here: their
# mise prebuilts ship a stale Go stdlib (some have no newer release). They are
# built from source in the Dockerfile's go-builder stage.
ripgrep = "15.1.0"
bat = "0.26.1"
yazi = "26.5.6"
starship = "1.25.1"
delta = "0.19.2"
atuin = "18.16.1"
fd = "10.4.2"
zoxide = "0.10.0"
eza = "0.23.4"
vivid = "0.11.1"
tree-sitter = "0.25.10"
pi = "0.81.1"
# No `go` here: the toolchain lives only in the Dockerfile's go-builder stage and is
# pinned by its GO_VERSION build arg (the single source of truth), so it never ships.
"aqua:fish-shell/fish-shell" = "4.8.0"
"aqua:tealdeer-rs/tealdeer" = "1.8.1"
claude = "2.1.206"

[settings]
experimental = false
